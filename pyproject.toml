[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"


[project]
name = "repomind"
version = "0.1.0"
description = "A production-style repository investigation agent built with Python and Ollama."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0,<3.0",
    "requests>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]


[project.scripts]
repomind = "repomind.main:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["repomind*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "UP", # modern Python syntax
    "B", # bugbear
]

ignore = [
    "E501", # Line too long; handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"